name: "kai-explainer-creative-review-round"
description: "One explicit creative-review pass; called by kai-explainer."
worktree:
  enabled: false
inputs:
  project:
    description: "Explicit lowercase project slug"
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  -
    id: "build"
    depends_on: []
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs build \"$INPUTS_PROJECT\""
  -
    id: "preview"
    depends_on:
      - "build"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs preview \"$INPUTS_PROJECT\""
    when: "$build.output.status == 'complete'"
  -
    id: "freeze"
    depends_on:
      - "preview"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs freeze \"$INPUTS_PROJECT\""
  -
    id: "visual-evidence"
    depends_on:
      - "freeze"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs visual-evidence \"$INPUTS_PROJECT\""
  -
    id: "visual-review"
    depends_on:
      - "visual-evidence"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. This is the ONE independent visual review. Read docs/review.md, the saved treatment profile and jobs/$INPUTS.project/review/final/pack.json. Inspect actual frozen images/temporal evidence over the full interval for visual mechanism, continuity and legibility. Record pass, revise or incomplete truthfully with findings and actual inspection limitations. Submit ONE report using lib/review.mjs submitReview(job,report), role "visual-review", reviewer identity "$WORKFLOW_ID:visual-review". Never edit production. You are independent from all registered producers. Unavailable inspection means incomplete. The author gets exactly one revision after your report; no second review will occur.
  -
    id: "review-join"
    depends_on:
      - "visual-review"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs review-round \"$INPUTS_PROJECT\""
  -
    id: "register-revision"
    depends_on:
      - "review-join"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("producer", {role:"scene-author",runId:process.env.INPUTS_RUN});
    with:
      run: "$WORKFLOW_ID"
  -
    id: "revision"
    depends_on:
      - "register-revision"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. This is the ONE revision after independent visual review, even if the review passed. Read jobs/$INPUTS.project/review/archon-findings.json, review/build.json within that project, the saved profile, docs/composition.md (rules-story) or engines/explainroo/AGENTS.md and engines/explainroo/templates/kai/TEMPLATE.md (Kai). Address all demonstrated findings in the project's scene files and visual settings. Preserve approved script, recording and measured timing. This invocation authorizes you to save changes. Create jobs/$INPUTS.project/review/revision-notes.md describing actual changes and any unresolved findings; if no change is warranted, explain that. Do not write reviewer reports or claim your revision was independently approved. The workflow proceeds after this revision and technical checks, without another creative review. Producer identity: $WORKFLOW_ID:scene-author.
  -
    id: "revision-build"
    depends_on:
      - "revision"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs build \"$INPUTS_PROJECT\""
  -
    id: "revision-complete"
    depends_on:
      - "revision-build"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs revision-complete \"$INPUTS_PROJECT\""
  -
    id: "revised-preview"
    depends_on:
      - "revision-complete"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs preview \"$INPUTS_PROJECT\""
  -
    id: "round-result"
    depends_on:
      - "revised-preview"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs film-loop-check \"$INPUTS_PROJECT\""
returns: "round-result"
