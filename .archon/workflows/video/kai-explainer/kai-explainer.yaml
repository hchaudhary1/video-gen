name: "kai-explainer"
description: "Produce first-person Kai explainers through direct explainroo media functions, independent review and operator decisions."
worktree:
  enabled: false
inputs:
  project:
    description: "Explicit lowercase project slug"
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  -
    id: "recover"
    depends_on: []
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
  -
    id: "research-state"
    depends_on:
      - "recover"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"'
    trigger_rule: "none_failed_min_one_success"
  -
    id: "research"
    depends_on:
      - "research-state"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved Kai profile. Research the brief and keep SOURCES.md and sources/ local evidence in jobs/scripts/$INPUTS.project. Retain primary sources for all factual claims and first-person research claims. Never invent personal experience. Complete only this assignment.
    when: "$research-state.output.artifacts.done == false"
    retry:
      max_attempts: 2
      on_error: "transient"
  -
    id: "research-state-1"
    depends_on:
      - "research-state"
      - "research"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"'
    trigger_rule: "none_failed_min_one_success"
  -
    id: "research-completion-1"
    depends_on:
      - "research-state-1"
    when: "$research-state-1.output.artifacts.done == false"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved Kai profile. Research the brief and keep SOURCES.md and sources/ local evidence in jobs/scripts/$INPUTS.project. Retain primary sources for all factual claims and first-person research claims. Never invent personal experience. Complete only this assignment.
      Read the latest research-status errors and produce the missing substantive files. Existing evidence must be preserved. The source index is SOURCES.md directly in the script folder; local evidence belongs in sources/.
  -
    id: "research-state-2"
    depends_on:
      - "research-state-1"
      - "research-completion-1"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"'
    trigger_rule: "none_failed_min_one_success"
  -
    id: "research-completion-2"
    depends_on:
      - "research-state-2"
    when: "$research-state-2.output.artifacts.done == false"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved Kai profile. Research the brief and keep SOURCES.md and sources/ local evidence in jobs/scripts/$INPUTS.project. Retain primary sources for all factual claims and first-person research claims. Never invent personal experience. Complete only this assignment.
      Read the latest research-status errors and produce the missing substantive files. Existing evidence must be preserved. The source index is SOURCES.md directly in the script folder; local evidence belongs in sources/.
  -
    id: "research-state-3"
    depends_on:
      - "research-state-2"
      - "research-completion-2"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"'
    trigger_rule: "none_failed_min_one_success"
  -
    id: "research-ready"
    depends_on:
      - "research-state-3"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs research-check "$INPUTS_PROJECT"'
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-state-1"
    depends_on:
      - "research-ready"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-1"
    depends_on:
      - "script-cycle-state-1"
    when: "$script-cycle-state-1.output.artifacts.done == false"
    workflow: "kai-explainer-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle-state-2"
    depends_on:
      - "script-cycle-state-1"
      - "script-cycle-round-1"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-2"
    depends_on:
      - "script-cycle-state-2"
    when: "$script-cycle-state-2.output.artifacts.done == false"
    workflow: "kai-explainer-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle"
    depends_on:
      - "script-cycle-state-2"
      - "script-cycle-round-2"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-check \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "narration"
    depends_on:
      - "script-cycle"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs narration \"$INPUTS_PROJECT\""
    retry:
      max_attempts: 2
      on_error: "transient"
  -
    id: "audio-evidence"
    depends_on:
      - "narration"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs audio-evidence \"$INPUTS_PROJECT\""
  -
    id: "audio-review"
    depends_on:
      - "audio-evidence"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs audio-review "$INPUTS_PROJECT"'
  -
    id: "audio-reviewed"
    depends_on:
      - "audio-review"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs audio-reviewed "$INPUTS_PROJECT"'
  -
    id: "production-state"
    depends_on:
      - "audio-reviewed"
    always_run: true
    bash: 'node scripts/archon/kai-explainer.mjs production-result "$INPUTS_PROJECT"'
  -
    id: "register-director"
    depends_on:
      - "production-state"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("producer", {role:"director",runId:process.env.INPUTS_RUN});
    with:
      run: "$WORKFLOW_ID"
    when: "$production-state.output.artifacts.done == false"
  -
    id: "direction"
    depends_on:
      - "production-state"
      - "register-director"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. Read jobs/scripts/$INPUTS.project/production-profile.json, engines/explainroo/AGENTS.md Scene API and engines/explainroo/templates/kai/TEMPLATE.md. Author jobs/$INPUTS.project/scenes.js using jobs/$INPUTS.project/build/timeline.json. Implement an exported scene function for every measured timeline scene ID. Create moving explanations, intermediate states and coherent handoffs; load actual heavy fonts. Use the full Scene API. Preserve script.md, voice configuration and approved recordings. This node owns only direction and scene authoring; Archon owns progression. Registered producer identity: $WORKFLOW_ID:director.
    trigger_rule: "none_failed_min_one_success"
    when: "$production-state.output.artifacts.done == false"
    retry:
      max_attempts: 2
      on_error: "transient"
  -
    id: "production"
    depends_on:
      - "production-state"
      - "direction"
    workflow: "kai-explainer-production-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
    trigger_rule: "none_failed_min_one_success"
    when: "$production-state.output.artifacts.done == false"
  -
    id: "delivery"
    depends_on:
      - "production-state"
      - "production"
    trigger_rule: "none_failed_min_one_success"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs deliver \"$INPUTS_PROJECT\""
  -
    id: "thumbnail-cycle-state-1"
    depends_on:
      - "delivery"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs thumbnail-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "thumbnail-cycle-round-1"
