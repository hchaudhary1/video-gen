      - "thumbnail-cycle-state-1"
    when: "$thumbnail-cycle-state-1.output.artifacts.done == false"
    workflow: "kai-explainer-thumbnail-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "thumbnail-cycle-state-2"
