name: "kai-explainer"
description: "Produce first-person Kai explainers through direct explainroo media functions, independent review and operator decisions."
worktree:
  enabled: false
inputs:
  project:
    description: "Explicit lowercase project slug"
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  -
    id: "recover"
    depends_on: []
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
  -
    id: "research"
    depends_on:
      - "recover"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. Read AGENTS.md, docs/production.md and the saved Kai profile. Research the brief and keep sources/SOURCES.md and local evidence in jobs/scripts/$INPUTS.project. Retain primary sources for all factual claims and first-person research claims. Never invent personal experience. Complete only this assignment.
  -
    id: "script-cycle-state-1"
    depends_on:
      - "research"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-1"
    depends_on:
      - "script-cycle-state-1"
    when: "$script-cycle-state-1.output.artifacts.done == false"
    workflow: "kai-explainer-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle-state-2"
    depends_on:
      - "script-cycle-state-1"
      - "script-cycle-round-1"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-2"
    depends_on:
      - "script-cycle-state-2"
    when: "$script-cycle-state-2.output.artifacts.done == false"
    workflow: "kai-explainer-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle-state-3"
    depends_on:
      - "script-cycle-state-2"
      - "script-cycle-round-2"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-3"
    depends_on:
      - "script-cycle-state-3"
    when: "$script-cycle-state-3.output.artifacts.done == false"
    workflow: "kai-explainer-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle-state-4"
    depends_on:
      - "script-cycle-state-3"
      - "script-cycle-round-3"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-4"
    depends_on:
      - "script-cycle-state-4"
    when: "$script-cycle-state-4.output.artifacts.done == false"
    workflow: "kai-explainer-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle"
    depends_on:
      - "script-cycle-state-4"
      - "script-cycle-round-4"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs script-loop-check \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "narration"
    depends_on:
      - "script-cycle"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs narration \"$INPUTS_PROJECT\""
  -
    id: "audio-evidence"
    depends_on:
      - "narration"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs audio-evidence \"$INPUTS_PROJECT\""
  -
    id: "audio-review"
    depends_on:
      - "audio-evidence"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. You are the independent audio reviewer after narration generation. Read jobs/scripts/$INPUTS.project/SCRIPT.md and the audio evidence from the preceding node: $audio-evidence.output.artifacts. Inspect the listed recording and ASR measurements using actual available capabilities. Review coverage, missing or unexpected speech and any demonstrated pronunciation or intelligibility defects. A match rate of at least 0.9 with unconfirmed individual words is accepted measured coverage; don't equate ASR uncertainty with proven mispronunciation. Reject demonstrated defects or failed measurements. Disclose whether you actually heard audio; do not claim listening or naturalness from ASR. Do not edit script, narration or timing. Return pass, findings, limitations.
    output_format:
      type: "object"
      properties:
        pass:
          type: "boolean"
        findings:
          type: "string"
        limitations:
          type: "array"
          items:
            type: "string"
      required:
        - "pass"
        - "findings"
        - "limitations"
  -
    id: "audio-reviewed"
    depends_on:
      - "audio-review"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("audio-reviewed", {expected:process.env.INPUTS_BINDING,report:JSON.parse(process.env.INPUTS_REPORT)});
    with:
      binding: "$audio-evidence.output.artifacts.binding"
      report: "$audio-review.output"
  -
    id: "register-director"
    depends_on:
      - "audio-reviewed"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("producer", {role:"director",runId:process.env.INPUTS_RUN});
    with:
      run: "$WORKFLOW_ID"
  -
    id: "direction"
    depends_on:
      - "register-director"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. Read jobs/scripts/$INPUTS.project/production-profile.json, engines/explainroo/AGENTS.md Scene API and engines/explainroo/templates/kai/TEMPLATE.md. Author jobs/$INPUTS.project/scenes.js using jobs/$INPUTS.project/build/timeline.json. Implement an exported scene function for every measured timeline scene ID. Create moving explanations, intermediate states and coherent handoffs; load actual heavy fonts. Use the full Scene API. Preserve script.md, voice configuration and approved recordings. This node owns only direction and scene authoring; Archon owns progression. Registered producer identity: $WORKFLOW_ID:director.
  -
    id: "production"
    depends_on:
      - "direction"
    workflow: "kai-explainer-production-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "delivery"
    depends_on:
      - "production"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs deliver \"$INPUTS_PROJECT\""
  -
    id: "thumbnail-cycle-state-1"
    depends_on:
      - "delivery"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs thumbnail-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "thumbnail-cycle-round-1"
    depends_on:
      - "thumbnail-cycle-state-1"
    when: "$thumbnail-cycle-state-1.output.artifacts.done == false"
    workflow: "kai-explainer-thumbnail-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "thumbnail-cycle-state-2"
    depends_on:
      - "thumbnail-cycle-state-1"
      - "thumbnail-cycle-round-1"
    always_run: true
    bash: "node scripts/archon/kai-explainer.mjs thumbnail-loop-result \"$INPUTS_PROJECT\""
