name: kai-explainer
description: Produce first-person Kai explainers through direct explainroo media functions, independent review and operator decisions.
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: 'Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut'
    default: '{}'
nodes:
- id: recover
  depends_on: []
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
    await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
- id: research-state
  depends_on:
  - recover
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: research
  depends_on:
  - research-state
  when: $research-state.output.artifacts.done == false
  context: fresh
  prompt: |-
    Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved Kai profile. Research the brief and keep SOURCES.md and sources/ local evidence in jobs/scripts/$INPUTS.project. Retain primary sources for all factual claims and first-person research claims. Never invent personal experience. Complete only this assignment.
    If research files already exist from an earlier pass, run `node scripts/archon/kai-explainer.mjs research-status $INPUTS.project` first. Read the latest research-status errors and produce the missing substantive files. Existing evidence must be preserved. The source index is SOURCES.md directly in the script folder; local evidence belongs in sources/.
  retry:
    max_attempts: 2
    on_error: transient
- id: research-recheck
  depends_on:
  - research-state
  - research
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: research-fix
  depends_on:
  - research-recheck
  when: $research-recheck.output.artifacts.done == false
  context: fresh
  prompt: |-
    Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved Kai profile. Research the brief and keep SOURCES.md and sources/ local evidence in jobs/scripts/$INPUTS.project. Retain primary sources for all factual claims and first-person research claims. Never invent personal experience. Complete only this assignment.
    If research files already exist from an earlier pass, run `node scripts/archon/kai-explainer.mjs research-status $INPUTS.project` first. Read the latest research-status errors and produce the missing substantive files. Existing evidence must be preserved. The source index is SOURCES.md directly in the script folder; local evidence belongs in sources/.
    This is the ONE research fix pass. Run `node scripts/archon/kai-explainer.mjs research-status $INPUTS.project` and produce only what its errors report as missing. Production continues after this pass whether or not every error is resolved; the independent script review will see any gap.
  retry:
    max_attempts: 2
    on_error: transient
- id: research-ready
  depends_on:
  - research-recheck
  - research-fix
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs research-status "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: script-cycle
  depends_on:
  - research-ready
  loop_group:
    max_iterations: 2
    until_bash: node scripts/archon/kai-explainer.mjs script-loop-check "$INPUTS_PROJECT"
    nodes:
    - id: script-answer
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        const answer = process.env.INPUTS_ANSWER;
        await emit("answer", {kind:"script", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
      with:
        binding: $LOOP_PREV.script-gate.output.artifacts.binding
        answer: $LOOP_PREV.script-attention.output
    - id: script-stop
      depends_on:
      - script-answer
      when: $script-answer.output.artifacts.rejected == true
      cancel: Operator stopped this production; retained artifacts remain available.
    - id: script-state
      depends_on:
      - script-answer
      - script-stop
      trigger_rule: none_failed_min_one_success
      always_run: true
      bash: node scripts/archon/kai-explainer.mjs script-status "$INPUTS_PROJECT"
    - id: write
      depends_on:
      - script-state
      context: fresh
      model: claude-opus-5-5
      prompt: |-
        Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved jobs/scripts/$INPUTS.project/production-profile.json. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
        Read skills/script-writing/SKILL.md. The Archon invocation and this node assignment authorize creation of this project’s outputs; missing SCRIPT.md, VISUALS.md, review.md, or archon/script-decision.json is expected on a new project and is never a reason to stop or self-discover whether this is the active author node. jobs/scripts/$INPUTS.project/SOURCES.md and local evidence must already exist from the upstream research node; use those cited sources before writing factual claims. Create SCRIPT.md, research.md, and VISUALS.md in the project directory (jobs/scripts/$INPUTS.project) and ensure they are substantive. Read review.md and archon/script-decision.json only when present. If inputScript is supplied and canRevise is false, preserve every byte of SCRIPT.md and only produce missing research / visual intent. A user revision permits only the requested changes. Do not review your own work; do not report success unless required files were actually written.
      when: $script-state.output.artifacts.needsWrite == true
      retry: &id001
        max_attempts: 2
        on_error: transient
    - id: script-binding
      depends_on:
      - script-state
      - write
      always_run: true
      bash: node scripts/archon/kai-explainer.mjs script-review-request "$INPUTS_PROJECT"
      trigger_rule: none_failed_min_one_success
    - id: script-review
      when: $script-binding.output.artifacts.needsReview == true
      always_run: true
      depends_on:
      - script-binding
      context: fresh
      model: claude-opus-5-5
      prompt: |-
        This is PRE-NARRATION, TEXT-ONLY script review. Audio, measured narration timing, alignment, scene implementation, final title/thumbnail and rendering do not exist at this stage; their absence is NOT missing evidence and must not cause an incomplete verdict. Use word count only for a duration estimate. PACKAGE.md is optional: if absent, evaluate the promise against BRIEF.md and the script, without blocking on packaging. A legitimately unreadable or missing source needed for a material factual claim still requires an incomplete verdict naming that claim and source.
        You are the independent script reviewer for project $INPUTS.project. This Archon node explicitly commissions file inspection and writing the review. Work from the repository root; tools are available for reading files and writing your report.
        Read jobs/scripts/$INPUTS.project/production-profile.json, BRIEF.md, SCRIPT.md, VISUALS.md, SOURCES.md and retained source evidence in that project. Follow skills/script-writing/references/review.md. Do not change author files, sources, script or visual intent. This is the ONLY review of this script: a revise or incomplete disposition gets one author fix round and production then continues without another review, so put every material finding in this report.
        The exact review binding is $script-binding.output.artifacts.binding. Write substantive findings to jobs/scripts/$INPUTS.project/review-draft.md using file tools. Include concrete findings supported by the files you actually inspected, and a final line "Disposition: pass", "Disposition: revise" or "Disposition: incomplete". A missing previous report is expected; you are responsible for creating it. If evidence is genuinely missing, still write a binding-tagged incomplete report naming what is missing. Do not claim inspection you did not perform.
        After writing the draft, run `node scripts/archon/script-review-report.mjs $INPUTS.project`. It reads the explicit project slug and the deterministic archon/script-review-request.json assignment and writes review.md with the exact verified binding. Do not transcribe the hash by hand. Complete this command before finishing. Finish with a short plain-language confirmation of the report path. Do not return JSON; the next deterministic node reads your report and produces the machine result.
    - id: script-report
      when: $script-binding.output.artifacts.needsReview == true
      depends_on:
      - script-review
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        await emit("script-reviewed", {expected: process.env.INPUTS_BINDING});
      with:
        binding: $script-binding.output.artifacts.binding
    - id: script-fix-state
      depends_on:
      - script-binding
      - script-report
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/kai-explainer.mjs script-status "$INPUTS_PROJECT"
    - id: script-fix
      depends_on:
      - script-fix-state
      context: fresh
      model: claude-opus-5-5
      retry: *id001
      when: $script-fix-state.output.artifacts.needsFix == true
      prompt: |-
        Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and the saved jobs/scripts/$INPUTS.project/production-profile.json. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
        Read skills/script-writing/SKILL.md. The Archon invocation and this node assignment authorize creation of this project’s outputs; missing SCRIPT.md, VISUALS.md, review.md, or archon/script-decision.json is expected on a new project and is never a reason to stop or self-discover whether this is the active author node. jobs/scripts/$INPUTS.project/SOURCES.md and local evidence must already exist from the upstream research node; use those cited sources before writing factual claims. Create SCRIPT.md, research.md, and VISUALS.md in the project directory (jobs/scripts/$INPUTS.project) and ensure they are substantive. Read review.md and archon/script-decision.json only when present. If inputScript is supplied and canRevise is false, preserve every byte of SCRIPT.md and only produce missing research / visual intent. A user revision permits only the requested changes. Do not review your own work; do not report success unless required files were actually written.
        This is the ONE fix round after the independent script review. Read review.md and address every concrete finding in SCRIPT.md, research.md and VISUALS.md. The workflow continues after this fix WITHOUT another review, so fix substantively and keep the scene syntax valid: run `node scripts/archon/kai-explainer.mjs script-status $INPUTS.project` before finishing and correct any reported errors. Record what you changed and any finding you could not resolve at the end of research.md under "## Review fix".
    - id: script-continue
      depends_on:
      - script-fix-state
      - script-fix
      always_run: true
      trigger_rule: none_failed_min_one_success
      when: $script-fix-state.output.artifacts.needsContinuation == true
      bash: node scripts/archon/kai-explainer.mjs script-continue "$INPUTS_PROJECT"
    - id: script-reviewed-state
      depends_on:
      - script-fix-state
      - script-continue
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/kai-explainer.mjs script-status "$INPUTS_PROJECT"
    - id: script-gate
      depends_on:
      - script-reviewed-state
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        await emit("gate", {kind:"script"});
    - id: script-attention
      depends_on:
      - script-gate
      when: $script-reviewed-state.output.artifacts.ready == true && $script-gate.output.artifacts.needsAnswer == true
      wait:
        form: select
        attention: 'Review $script-gate.output.artifacts.artifact for $INPUTS.project. Binding: $script-gate.output.artifacts.binding. Choose approve, revise or reject. Approval needs no comment; revisions require your actual feedback.'
        options:
        - id: approve
          label: Approve
        - id: revise
          label: Request changes
        - id: reject
          label: Stop
- id: narration
  depends_on:
  - script-cycle
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs narration "$INPUTS_PROJECT" --route
  retry:
    max_attempts: 1
    on_error: all
- id: narration-fix
  depends_on:
  - narration
  when: $narration.output.status == 'repair'
  context: fresh
  model: claude-opus-5-5
  prompt: 'Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Read AGENTS.md, skills/script-writing/SKILL.md and jobs/$INPUTS.project/review/narration-repair.json. The measured Kai narration missed the duration target by more than 20%. This is the ONE narration fix round: edit jobs/scripts/$INPUTS.project/SCRIPT.md so the spoken text is close to targetWords words (the receipt also gives the measured length, target and current word count). Cut or add material proportionally across scenes; keep every scene heading, marker and the explainroo narration syntax, every sourced claim and its attribution, and the hook. Do not add unsourced claims. Run `node scripts/archon/kai-explainer.mjs script-status $INPUTS.project` and fix any reported syntax error. The narration is regenerated after this fix and production continues WITHOUT another script review, whatever length it measures. Append what you cut or added to jobs/scripts/$INPUTS.project/research.md under "## Duration fix". Do not edit any other project files.'
  retry:
    max_attempts: 2
    on_error: transient
- id: narration-final
  depends_on:
  - narration
  - narration-fix
  when: $narration.output.status == 'repair'
  always_run: true
  trigger_rule: none_failed_min_one_success
  bash: node scripts/archon/kai-explainer.mjs narration "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: audio-evidence
  depends_on:
  - narration
  - narration-final
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs audio-evidence "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: audio-review
  depends_on:
  - audio-evidence
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs audio-review "$INPUTS_PROJECT" --route
- id: audio-fix
  depends_on:
  - audio-review
  when: $audio-review.output.status == 'repair'
  context: fresh
  model: claude-opus-5-5
  prompt: 'Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Read AGENTS.md, engines/explainroo/AGENTS.md narration syntax, jobs/$INPUTS.project/review/narration-repair.json and jobs/$INPUTS.project/review/audio-review.json. The speech check could not confirm enough of the generated narration in the listed scenes. This is the ONE audio fix round: in jobs/scripts/$INPUTS.project/SCRIPT.md, change only those scenes so the speech engine says them clearly, for example spelling out numbers, symbols, acronyms and unusual names with the documented pronunciation syntax. Keep the meaning, claims and attribution. Run `node scripts/archon/kai-explainer.mjs script-status $INPUTS.project` and fix any reported syntax error. The changed scenes are regenerated once and production continues without another review. Append your changes to jobs/scripts/$INPUTS.project/research.md under "## Audio fix".'
  retry:
    max_attempts: 2
    on_error: transient
- id: audio-renarrate
  depends_on:
  - audio-fix
  when: $audio-review.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs narration "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: audio-evidence-final
  depends_on:
  - audio-renarrate
  when: $audio-review.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs audio-evidence "$INPUTS_PROJECT"
- id: audio-review-final
  depends_on:
  - audio-evidence-final
  when: $audio-review.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs audio-review "$INPUTS_PROJECT" '{"final":true}'
- id: audio-reviewed
  depends_on:
  - audio-review
  - audio-review-final
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs audio-reviewed "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: production-state
  depends_on:
  - audio-reviewed
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs production-result "$INPUTS_PROJECT"
- id: register-director
  depends_on:
  - production-state
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
    await emit("producer", {role:"director",runId:process.env.INPUTS_RUN});
  with:
    run: $WORKFLOW_ID
  when: $production-state.output.artifacts.done == false
- id: direction
  depends_on:
  - production-state
  - register-director
  context: fresh
  prompt: 'Project: $INPUTS.project. Read jobs/scripts/$INPUTS.project/production-profile.json, engines/explainroo/AGENTS.md Scene API and engines/explainroo/templates/kai/TEMPLATE.md. Author jobs/$INPUTS.project/scenes.js using jobs/$INPUTS.project/build/timeline.json. Implement an exported scene function for every measured timeline scene ID. Create moving explanations, intermediate states and coherent handoffs; load actual heavy fonts. Use the full Scene API. Preserve script.md, voice configuration and approved recordings. This node owns only direction and scene authoring; Archon owns progression. Registered producer identity: $WORKFLOW_ID:director.'
  trigger_rule: none_failed_min_one_success
  when: $production-state.output.artifacts.done == false
  retry:
    max_attempts: 2
    on_error: transient
- id: production
  depends_on:
  - production-state
  - direction
  workflow: kai-explainer-production-round
  isolation: inherit
  with:
    project: $INPUTS.project
    options: $INPUTS.options
  trigger_rule: none_failed_min_one_success
  when: $production-state.output.artifacts.done == false
- id: delivery
  depends_on:
  - production-state
  - production
  trigger_rule: none_failed_min_one_success
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs deliver "$INPUTS_PROJECT"
  retry:
    max_attempts: 1
    on_error: all
- id: thumbnail-cycle
  depends_on:
  - delivery
  loop_group:
    max_iterations: 4
    until_bash: node scripts/archon/kai-explainer.mjs thumbnail-loop-check "$INPUTS_PROJECT"
    nodes:
    - id: thumbnail-answer
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        const answer = process.env.INPUTS_ANSWER;
        await emit("answer", {kind:"thumbnail", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
      with:
        binding: $LOOP_PREV.thumbnail-gate.output.artifacts.binding
        answer: $LOOP_PREV.thumbnail-attention.output
    - id: thumbnail-stop
      depends_on:
      - thumbnail-answer
      when: $thumbnail-answer.output.artifacts.rejected == true
      cancel: Operator stopped this production; retained artifacts remain available.
    - id: thumbnail-state
      depends_on:
      - thumbnail-answer
      - thumbnail-stop
      trigger_rule: none_failed_min_one_success
      always_run: true
      bash: node scripts/archon/kai-explainer.mjs thumbnail-loop-result "$INPUTS_PROJECT"
    - id: thumbnail-generate
      depends_on:
      - thumbnail-state
      context: fresh
      prompt: |-
        Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and jobs/scripts/$INPUTS.project/production-profile.json and personalities/kai-explainer/PROFILE.md. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
        Read docs/publishing.md. Make or repair variants at the saved canvas dimensions. Use lib/thumbnails.mjs exportThumbnail for full PNG and feed preview. Read thumbnailStatus for requested count and per-variant feedback; preserve unchanged passing variants. Write BRIEF.md with Title, Headline, Description and original editable SVG with actual heavy fonts. Use the pinned local node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2 for heavy type; embed the actual font in the editable SVG. Do not search the web for a font. Inspect and export actual files, not a plan. Do not review your own variants.
      retry: &id002
        max_attempts: 2
        on_error: transient
      when: $thumbnail-state.output.artifacts.needsGenerate == true
    - id: thumbnail-review-state
      depends_on:
      - thumbnail-state
      - thumbnail-generate
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/kai-explainer.mjs thumbnail-status "$INPUTS_PROJECT"
    - id: thumbnail-review
      depends_on:
      - thumbnail-review-state
      context: fresh
      prompt: |-
        Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and jobs/scripts/$INPUTS.project/production-profile.json and personalities/kai-explainer/PROFILE.md. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
        Your actual assignment is thumbnail review, not workflow discovery. Call thumbnailStatus(job) from lib/thumbnails.mjs, where job is jobs/$INPUTS.project. Open each returned thumbnail.png and preview file using the native view_image tool; these are local files. Read personalities/kai-explainer/PROFILE.md, not a nonexistent project PROFILE.md. Independently view every made thumbnail PNG and feed preview. Use recordVerdict and recordRanking from lib/thumbnails.mjs with reviewer $WORKFLOW_ID:thumbnail-reviewer. Add actionable blocked findings as reviewer feedback with addThumbnailFeedback. Preserve all findings and rank only current passing variants. No claimed CTR measurements. This is the ONLY review of these variants: a blocked variant gets one fix round and is not reviewed again, so record every actionable finding now. Read the actual function signatures and finish the verdict/ranking library calls before returning. A summary of what you still need to read is not completion. Missing viewing capability must be recorded honestly as a blocked verdict, never an invented pass.
      retry:
        max_attempts: 2
        on_error: transient
      when: $thumbnail-review-state.output.artifacts.needsReview == true
    - id: thumbnail-join
      depends_on:
      - thumbnail-review-state
      - thumbnail-review
      always_run: true
      bash: node scripts/archon/kai-explainer.mjs thumbnail-status "$INPUTS_PROJECT"
      trigger_rule: none_failed_min_one_success
    - id: thumbnail-fix-request
      depends_on:
      - thumbnail-join
      always_run: true
      when: $thumbnail-join.output.artifacts.needsFix == true
      bash: node scripts/archon/kai-explainer.mjs thumbnail-fix-request "$INPUTS_PROJECT"
    - id: thumbnail-fix
      depends_on:
      - thumbnail-fix-request
      context: fresh
      retry: *id002
      when: $thumbnail-join.output.artifacts.needsFix == true
      prompt: |-
        Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and jobs/scripts/$INPUTS.project/production-profile.json and personalities/kai-explainer/PROFILE.md. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
        Read docs/publishing.md. Make or repair variants at the saved canvas dimensions. Use lib/thumbnails.mjs exportThumbnail for full PNG and feed preview. Read thumbnailStatus for requested count and per-variant feedback; preserve unchanged passing variants. Write BRIEF.md with Title, Headline, Description and original editable SVG with actual heavy fonts. Use the pinned local node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2 for heavy type; embed the actual font in the editable SVG. Do not search the web for a font. Inspect and export actual files, not a plan. Do not review your own variants.
        This is the ONE fix round after the independent thumbnail review. Read thumbnailStatus for each variant's review findings and open feedback, and remake the blocked variants so every finding is addressed, then re-export with exportThumbnail. Keep each PNG under 2 MB. The workflow selects a variant after this fix WITHOUT another review.
    - id: thumbnail-fixed
      depends_on:
      - thumbnail-fix
      always_run: true
      when: $thumbnail-join.output.artifacts.needsFix == true
      bash: node scripts/archon/kai-explainer.mjs thumbnail-fixed "$INPUTS_PROJECT"
    - id: thumbnail-select
      depends_on:
      - thumbnail-join
      - thumbnail-fixed
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/kai-explainer.mjs thumbnail-loop-result "$INPUTS_PROJECT"
    - id: thumbnail-gate
      depends_on:
      - thumbnail-select
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        await emit("gate", {kind:"thumbnail"});
    - id: thumbnail-attention
      depends_on:
      - thumbnail-gate
      when: $thumbnail-select.output.artifacts.selectable == true && $thumbnail-gate.output.artifacts.needsAnswer == true
      wait:
        form: select
        attention: 'Review $thumbnail-gate.output.artifacts.artifact for $INPUTS.project. Binding: $thumbnail-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback.'
        options: $thumbnail-gate.output.artifacts.options
- id: publishing-cycle
  depends_on:
  - thumbnail-cycle
  loop_group:
    max_iterations: 4
    until_bash: node scripts/archon/kai-explainer.mjs publishing-loop-check "$INPUTS_PROJECT"
    nodes:
    - id: publishing-answer
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        const answer = process.env.INPUTS_ANSWER;
        await emit("answer", {kind:"publishing", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
      with:
        binding: $LOOP_PREV.publishing-gate.output.artifacts.binding
        answer: $LOOP_PREV.publishing-attention.output
    - id: publishing-stop
      depends_on:
      - publishing-answer
      when: $publishing-answer.output.artifacts.rejected == true
      cancel: Operator stopped this production; retained artifacts remain available.
    - id: publishing-state
      depends_on:
      - publishing-answer
      - publishing-stop
      trigger_rule: none_failed_min_one_success
      always_run: true
      bash: node scripts/archon/kai-explainer.mjs publishing-loop-result "$INPUTS_PROJECT"
    - id: publishing-copy
      depends_on:
      - publishing-state
      context: fresh
      prompt: |-
        Project: $INPUTS.project. You are executing the active assigned Archon node. This invocation authorizes the work; do not search for a workflow run, start another controller, or stop after reading instructions. Complete the required files/library calls before finishing. Read AGENTS.md, docs/production.md and jobs/scripts/$INPUTS.project/production-profile.json and personalities/kai-explainer/PROFILE.md. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
        Write publishing.json in the script project folder with title, description, tags, privacy: unlisted and exact channelId for abdupdates (obtain it from the operator or configuration, never invent it; the channelId in the publishing.json of an earlier project that has archon/published.json was confirmed by an authenticated upload and may be reused). Read archon/publishing-decision.json and apply requested copy revisions. If archon/publishing-errors.json exists, fix every error it lists. Preserve existing approved copy. Include sources. Read docs/publishing.md. This node authors copy only; it does not approve or upload.
      when: $publishing-state.output.artifacts.done == false
      retry:
        max_attempts: 2
        on_error: transient
    - id: publishing-gate
      depends_on:
      - publishing-state
      - publishing-copy
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
        await emit("gate", {kind:"publishing"});
      trigger_rule: none_failed_min_one_success
    - id: publishing-attention
      depends_on:
      - publishing-gate
      when: $publishing-gate.output.artifacts.needsAnswer == true
      wait:
        form: select
        attention: 'Review $publishing-gate.output.artifacts.artifact for $INPUTS.project. Binding: $publishing-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback.'
        options:
        - id: approve
          label: Approve unlisted upload
        - id: revise
          label: Revise copy
        - id: opt-out
          label: Keep local only
        - id: reject
          label: Stop
- id: publish
  depends_on:
  - publishing-cycle
  always_run: true
  bash: node scripts/archon/kai-explainer.mjs publish "$INPUTS_PROJECT"
  retry:
    max_attempts: 1
    on_error: all
