name: kai-script
description: "Script lab for Kai explainers: research → write an argued take → one independent script review, then stop. Copies kai-explainer's nodes up to the script review so the script can be iterated alone."
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: "Creation options JSON for a new project: brief/brief-file, script, duration, format (same as kai-explainer)"
    default: "{}"
  redo:
    description: "Re-run part of an existing project: none, review (new review of the current script), write (new script and review), research (everything). Earlier files are archived under archon/iterations/."
    default: none
nodes:
  - id: recover
    description: Create the project on first run (or load the saved one) and freeze the treatment profile and options; the project continues unchanged in kai-explainer.
    depends_on: []
    always_run: true
    runtime: bun
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
  - id: redo
    description: Archive the outputs the requested redo level replaces (review, write or research) under archon/iterations/, once per run.
    depends_on:
      - recover
    always_run: true
    bash: node scripts/archon/kai-script.mjs redo "$INPUTS_PROJECT" "$INPUTS_REDO"
  - id: research-state
    description: Check whether research is complete, including the take dossier (sources/ANALYSIS.md, community and video evidence), so a resumed run skips it.
    depends_on:
      - redo
    always_run: true
    bash: node scripts/archon/kai-script.mjs research-status "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: research
    description: Research the brief, independent evidence, community reactions and similar videos, and write the take dossier.
    depends_on:
      - research-state
    when: $research-state.output.artifacts.done == false
    context: fresh
    model: claude-opus-5-5
    command: research
    skills:
      - script-writing
    retry:
      max_attempts: 2
      on_error: transient
  - id: research-recheck
    description: Re-check the research files the author just produced; any errors trigger the one fix pass.
    depends_on:
      - research-state
      - research
    always_run: true
    bash: node scripts/archon/kai-script.mjs research-status "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: research-fix
    description: The one fix pass for research files the check still reports missing.
    depends_on:
      - research-recheck
    when: $research-recheck.output.artifacts.done == false
    context: fresh
    command: research-fix
    skills:
      - script-writing
    retry:
      max_attempts: 2
      on_error: transient
  - id: research-ready
    description: Final research check after the fix pass; the script continues whatever it reports, and script review sees any gap.
    depends_on:
      - research-recheck
      - research-fix
    always_run: true
    bash: node scripts/archon/kai-script.mjs research-status "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: script-state
    description: "Compute what the script needs now: write (missing / revision requested) or review. Also gives the writer supplied/canRevise/feedback."
    depends_on:
      - research-ready
    trigger_rule: none_failed_min_one_success
    always_run: true
    bash: node scripts/archon/kai-script.mjs script-status "$INPUTS_PROJECT"
  - id: write
    description: Commit to a take and write SCRIPT.md, research.md and VISUALS.md.
    depends_on:
      - script-state
    context: fresh
    model: claude-opus-5-5
    command: write
    skills:
      - script-writing
    when: $script-state.output.artifacts.needsWrite == true
    retry:
      max_attempts: 2
      on_error: transient
  - id: script-binding
    description: Hash the current script files and save archon/script-review-request.json, so the review is bound to exactly this text.
    depends_on:
      - script-state
      - write
    always_run: true
    bash: node scripts/archon/kai-script.mjs script-review-request "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: script-review
    description: Independent, text-only script review, including the take and voice.
    when: $script-binding.output.artifacts.needsReview == true
    always_run: true
    depends_on:
      - script-binding
    context: fresh
    model: claude-opus-5-5
    command: script-review
    skills:
      - script-writing
  - id: script-report
    description: Check the script did not change during review, then read review.md's binding and disposition into archon/script-review.json (a missing or unbound report counts as incomplete).
    when: $script-binding.output.artifacts.needsReview == true
    depends_on:
      - script-review
    always_run: true
    runtime: bun
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/kai-explainer.mjs");
      await emit("script-reviewed", {expected: process.env.INPUTS_BINDING});
    with:
      binding: $script-binding.output.artifacts.binding
  - id: script-result
    description: "Final state for the operator: script validity, review disposition and binding. The lab stops here; continue in kai-explainer (it applies the one fix) or re-run with redo."
    depends_on:
      - script-binding
      - script-report
    always_run: true
    trigger_rule: none_failed_min_one_success
    bash: node scripts/archon/kai-script.mjs script-status "$INPUTS_PROJECT"
