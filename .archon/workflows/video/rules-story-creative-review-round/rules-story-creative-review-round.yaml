name: rules-story-creative-review-round
description: One explicit creative-review pass; called by rules-story.
mutates_checkout: false
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  - id: build
    description: Build the film and run the engine checks (syntax, exports, fonts, layout); errors route to one technical repair.
    depends_on: []
    workflow: rules-story-build-cycle
    isolation: inherit
    with:
      project: $INPUTS.project
      phase: pre-review
  - id: freeze
    description: Freeze the review evidence pack (frames, contact sheets, clips, hashes) from the current usable build.
    depends_on:
      - build
    always_run: true
    bash: node scripts/archon/rules-story.mjs freeze "$INPUTS_PROJECT"
    when: $build.output.status == 'complete'
    retry:
      max_attempts: 1
      on_error: all
  - id: visual-evidence
    description: Copy the frozen evidence into review/original-evidence/<pack hash>/ and point the pack at it, so later rebuilds cannot change what the reviewer saw.
    depends_on:
      - freeze
    always_run: true
    bash: node scripts/archon/rules-story.mjs visual-evidence "$INPUTS_PROJECT"
  - id: visual-review-state
    description: Has a complete visual review (viewed, full coverage) already been submitted for this pack?
    depends_on:
      - visual-evidence
    always_run: true
    bash: node scripts/archon/rules-story.mjs visual-review-status "$INPUTS_PROJECT"
  - id: visual-review
    description: Independent visual review of the frozen evidence.
    depends_on:
      - visual-review-state
    when: $visual-review-state.output.artifacts.done == false
    context: fresh
    command: visual-review
    skills:
      - visual-review
    retry:
      max_attempts: 2
      on_error: transient
  - id: visual-review-recheck
    description: Did the reviewer submit a complete report? If not, one retry.
    depends_on:
      - visual-review-state
      - visual-review
    always_run: true
    trigger_rule: none_failed_min_one_success
    bash: node scripts/archon/rules-story.mjs visual-review-status "$INPUTS_PROJECT"
  - id: visual-review-retry
    description: Second and last attempt at the visual review.
    depends_on:
      - visual-review-recheck
    when: $visual-review-recheck.output.artifacts.done == false
    context: fresh
    command: visual-review-retry
    skills:
      - visual-review
    retry:
      max_attempts: 2
      on_error: transient
  - id: review-join
    description: "Close the review round: write review/archon-findings.json; if no complete review exists, record that and continue to the revision."
    depends_on:
      - visual-review-recheck
      - visual-review-retry
    always_run: true
    bash: node scripts/archon/rules-story.mjs review-round "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: register-revision
    description: Register the revising author as a producer.
    depends_on:
      - review-join
    always_run: true
    runtime: bun
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("producer", {role:"scene-author",runId:process.env.INPUTS_RUN});
    with:
      run: $WORKFLOW_ID
  - id: revision
    description: The one revision after the visual review.
    depends_on:
      - register-revision
    context: fresh
    command: revision
    skills:
      - hyperframes
      - typography
    retry:
      max_attempts: 2
      on_error: transient
  - id: revision-build
    description: Rebuild after the revision (one build cycle).
    depends_on:
      - revision
    workflow: rules-story-build-cycle
    isolation: inherit
    with:
      project: $INPUTS.project
      phase: post-revision
  - id: revision-complete
    description: Record review/visual-revision.json binding the review to the revised source and revision notes.
    depends_on:
      - revision-build
    always_run: true
    bash: node scripts/archon/rules-story.mjs revision-complete "$INPUTS_PROJECT"
  - id: round-result
    description: Return this round's result to the parent workflow.
    depends_on:
      - revision-complete
    always_run: true
    bash: node scripts/archon/rules-story.mjs film-loop-result "$INPUTS_PROJECT"
returns: round-result
