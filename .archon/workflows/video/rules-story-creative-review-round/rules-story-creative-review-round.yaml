name: rules-story-creative-review-round
description: One explicit creative-review pass; called by rules-story.
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: 'Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut'
    default: '{}'
nodes:
- id: build
  depends_on: []
  workflow: rules-story-build-cycle
  isolation: inherit
  with:
    project: $INPUTS.project
    phase: pre-review
- id: freeze
  depends_on:
  - build
  always_run: true
  bash: node scripts/archon/rules-story.mjs freeze "$INPUTS_PROJECT"
  when: $build.output.status == 'complete'
  retry:
    max_attempts: 1
    on_error: all
- id: visual-evidence
  depends_on:
  - freeze
  always_run: true
  bash: node scripts/archon/rules-story.mjs visual-evidence "$INPUTS_PROJECT"
- id: visual-review-state
  depends_on:
  - visual-evidence
  always_run: true
  bash: node scripts/archon/rules-story.mjs visual-review-status "$INPUTS_PROJECT"
- id: visual-review
  depends_on:
  - visual-review-state
  when: $visual-review-state.output.artifacts.done == false
  context: fresh
  command: visual-review
  skills:
  - visual-review
  retry:
    max_attempts: 2
    on_error: transient
- id: visual-review-recheck
  depends_on:
  - visual-review-state
  - visual-review
  always_run: true
  trigger_rule: none_failed_min_one_success
  bash: node scripts/archon/rules-story.mjs visual-review-status "$INPUTS_PROJECT"
- id: visual-review-retry
  depends_on:
  - visual-review-recheck
  when: $visual-review-recheck.output.artifacts.done == false
  context: fresh
  command: visual-review-retry
  skills:
  - visual-review
  retry:
    max_attempts: 2
    on_error: transient
- id: review-join
  depends_on:
  - visual-review-recheck
  - visual-review-retry
  always_run: true
  bash: node scripts/archon/rules-story.mjs review-round "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: register-revision
  depends_on:
  - review-join
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("producer", {role:"scene-author",runId:process.env.INPUTS_RUN});
  with:
    run: $WORKFLOW_ID
- id: revision
  depends_on:
  - register-revision
  context: fresh
  command: revision
  skills:
  - hyperframes
  retry:
    max_attempts: 2
    on_error: transient
- id: revision-build
  depends_on:
  - revision
  workflow: rules-story-build-cycle
  isolation: inherit
  with:
    project: $INPUTS.project
    phase: post-revision
- id: revision-complete
  depends_on:
  - revision-build
  always_run: true
  bash: node scripts/archon/rules-story.mjs revision-complete "$INPUTS_PROJECT"
- id: round-result
  depends_on:
  - revision-complete
  always_run: true
  bash: node scripts/archon/rules-story.mjs film-loop-result "$INPUTS_PROJECT"
returns: round-result
