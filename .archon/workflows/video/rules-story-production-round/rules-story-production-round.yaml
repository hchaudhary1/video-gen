name: rules-story-production-round
description: One explicit production pass; called by rules-story.
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: 'Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut'
    default: '{}'
nodes:
- id: creative-review
  description: Build, freeze evidence, one independent visual review and one revision.
  depends_on: []
  workflow: rules-story-creative-review-round
  isolation: inherit
  with:
    project: $INPUTS.project
    options: $INPUTS.options
- id: film-gate
  description: Hash the frozen evidence pack + sources (+ Kai preview) and check whether operator film approval is required and given.
  depends_on:
  - creative-review
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("gate", {kind:"film"});
- id: film-attention
  description: Ask the operator to approve, revise or stop the film.
  depends_on:
  - film-gate
  when: $film-gate.output.artifacts.needsAnswer == true
  wait:
    form: select
    attention: 'Review $film-gate.output.artifacts.artifact for $INPUTS.project. Binding: $film-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback.'
    options:
    - id: approve
      label: Approve
    - id: revise
      label: Request changes
    - id: reject
      label: Stop
- id: film-answer
  description: Record the operator's film decision, bound to the exact pack they saw.
  depends_on:
  - film-gate
  - film-attention
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("checkpoint", {kind:"film", expected: process.env.INPUTS_BINDING, answer: JSON.parse(process.env.INPUTS_ANSWER)});
  when: $film-gate.output.artifacts.needsAnswer == true
  trigger_rule: none_failed_min_one_success
  with:
    binding: $film-gate.output.artifacts.binding
    answer: $film-attention.output
- id: film-stop
  description: 'Operator chose Stop: end the run, keeping all artifacts.'
  depends_on:
  - film-answer
  when: $film-answer.output.artifacts.rejected == true
  cancel: Operator stopped this production; retained artifacts remain available.
- id: film-accepted
  description: 'Re-read the film gate after the answer: approved, or approval not required.'
  depends_on:
  - film-gate
  - film-answer
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("gate", {kind:"film"});
  trigger_rule: none_failed_min_one_success
- id: render
  description: Render the delivery video (renders/video.mp4); refuses without current reviews and any required approval. Skipped when sources are unchanged.
  depends_on:
  - film-accepted
  always_run: true
  bash: node scripts/archon/rules-story.mjs render "$INPUTS_PROJECT"
  when: $film-accepted.output.artifacts.approved == true || $film-accepted.output.artifacts.required == false
  retry:
    max_attempts: 1
    on_error: all
- id: verify
  description: Technical verification of the rendered video (streams, canvas, length, speech, playback checks). Fixable issues route to technical-fix.
  depends_on:
  - render
  always_run: true
  bash: node scripts/archon/rules-story.mjs verify "$INPUTS_PROJECT" --route
  retry:
    max_attempts: 1
    on_error: all
- id: technical-fix
  description: The one agent fix for issues found in the render.
  depends_on:
  - verify
  when: $verify.output.artifacts.fixable == true
  context: fresh
  command: technical-fix
  skills:
  - hyperframes
  - typography
  retry:
    max_attempts: 2
    on_error: transient
- id: technical-build
  description: Rebuild after the technical fix (one build cycle).
  depends_on:
  - technical-fix
  when: $verify.output.artifacts.fixable == true
  workflow: rules-story-build-cycle
  isolation: inherit
  with:
    project: $INPUTS.project
    phase: post-verify
- id: technical-revision
  description: Record the technical revision receipt binding the fix to the new source hash.
  depends_on:
  - technical-build
  when: $verify.output.artifacts.fixable == true
  always_run: true
  bash: node scripts/archon/rules-story.mjs technical-revision-complete "$INPUTS_PROJECT"
- id: technical-render
  description: Re-render after the technical fix.
  depends_on:
  - technical-revision
  when: $verify.output.artifacts.fixable == true
  always_run: true
  bash: node scripts/archon/rules-story.mjs render "$INPUTS_PROJECT"
  retry:
    max_attempts: 1
    on_error: all
- id: technical-verify
  description: Final verification; remaining issues are accepted and disclosed in delivery.
  depends_on:
  - verify
  - technical-render
  when: $verify.output.status == 'repair'
  always_run: true
  trigger_rule: none_failed_min_one_success
  bash: node scripts/archon/rules-story.mjs verify "$INPUTS_PROJECT" '{"final":true}' --route
  retry:
    max_attempts: 1
    on_error: all
- id: production-result
  description: Is the render current, technically verified and (if required) approved?
  depends_on:
  - film-accepted
  - verify
  - technical-verify
  always_run: true
  bash: node scripts/archon/rules-story.mjs production-result "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: round-result
  description: Return this round's result to the parent workflow.
  depends_on:
  - production-result
  always_run: true
  bash: node scripts/archon/rules-story.mjs production-loop-result "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
returns: round-result
