# Explicit Archon nodes; bounded rounds retain durable human checkpoints.
name: "rules-story-publishing-cycle-round"
description: "One explicit publishing-cycle pass; called by rules-story."
worktree:
  enabled: false
inputs:
  project:
    description: "Explicit lowercase project slug"
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  -
    id: "publishing-copy"
    depends_on: []
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. Read AGENTS.md, docs/production.md and the saved production-profile.json / PROFILE.md. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
      Write publishing.json in the script project folder with title, description, tags, privacy: unlisted and exact channelId for abdupdates (obtain from operator/config, never invent). Read archon/publishing-decision.json and apply requested copy revisions. Preserve existing approved copy. Include sources. Read docs/publishing.md. This node authors copy only; it does not approve or upload.
  -
    id: "publishing-gate"
    depends_on:
      - "publishing-copy"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("gate", {kind:"publishing"});
  -
    id: "publishing-attention"
    depends_on:
      - "publishing-gate"
    when: "$publishing-gate.output.artifacts.needsAnswer == true"
    wait:
      form: "select"
      attention: "Review $publishing-gate.output.artifacts.artifact for $INPUTS.project. Binding: $publishing-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback."
      options:
        -
          id: "approve"
          label: "Approve unlisted upload"
        -
          id: "revise"
          label: "Revise copy"
        -
          id: "opt-out"
          label: "Keep local only"
        -
          id: "reject"
          label: "Stop"
  -
    id: "publishing-answer"
    depends_on:
      - "publishing-gate"
      - "publishing-attention"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("checkpoint", {kind:"publishing", expected: process.env.INPUTS_BINDING, answer: JSON.parse(process.env.INPUTS_ANSWER)});
    when: "$publishing-gate.output.artifacts.needsAnswer == true"
    trigger_rule: "none_failed_min_one_success"
    with:
      binding: "$publishing-gate.output.artifacts.binding"
      answer: "$publishing-attention.output"
  -
    id: "publishing-stop"
    depends_on:
      - "publishing-answer"
    when: "$publishing-answer.output.artifacts.rejected == true"
    cancel: "Operator stopped this production; retained artifacts remain available."
  -
    id: "publishing-accepted"
    depends_on:
      - "publishing-gate"
      - "publishing-answer"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("gate", {kind:"publishing"});
    trigger_rule: "none_failed_min_one_success"
  -
    id: "round-result"
    depends_on:
      - "publishing-accepted"
    always_run: true
    bash: "node scripts/archon/rules-story.mjs publishing-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
returns: "round-result"
