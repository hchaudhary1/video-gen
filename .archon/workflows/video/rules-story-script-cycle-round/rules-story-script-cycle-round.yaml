# Explicit Archon nodes; bounded rounds retain durable human checkpoints.
name: "rules-story-script-cycle-round"
description: "One explicit script-cycle pass; called by rules-story."
worktree:
  enabled: false
inputs:
  project:
    description: "Explicit lowercase project slug"
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  -
    id: "script-state"
    depends_on: []
    always_run: true
    bash: "node scripts/archon/rules-story.mjs script-status \"$INPUTS_PROJECT\""
  -
    id: "write"
    depends_on:
      - "script-state"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. Read AGENTS.md, docs/production.md and the saved jobs/scripts/$INPUTS.project/production-profile.json. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
      Read skills/script-writing/SKILL.md. Write or revise SCRIPT.md, research.md and VISUALS.md; read review.md and archon/script-decision.json for feedback. If inputScript is supplied and canRevise is false, preserve every byte of SCRIPT.md and only produce missing research / visual intent. A user revision permits only the requested changes. Do not review your own work.
    when: "$script-state.output.artifacts.needsWrite == true"
  -
    id: "script-binding"
    depends_on:
      - "script-state"
      - "write"
    always_run: true
    bash: "node scripts/archon/rules-story.mjs script-status \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-review"
    when: "$script-binding.output.artifacts.ready == false"
    always_run: true
    depends_on:
      - "script-binding"
    context: "fresh"
    prompt: |-
      This is PRE-NARRATION, TEXT-ONLY script review. Audio, measured narration timing, alignment, scene implementation, final title/thumbnail and rendering do not exist at this stage; their absence is NOT missing evidence and must not cause an incomplete verdict. Use word count only for a duration estimate. PACKAGE.md is optional: if absent, evaluate the promise against BRIEF.md and the script, without blocking on packaging. A legitimately unreadable or missing source needed for a material factual claim still requires an incomplete verdict naming that claim and source.
      You are the independent script reviewer for project $INPUTS.project. This Archon node explicitly commissions file inspection and writing the review. Work from the repository root; tools are available for reading files and writing your report.
      Read jobs/scripts/$INPUTS.project/production-profile.json, BRIEF.md, SCRIPT.md, VISUALS.md, SOURCES.md and retained source evidence in that project. Follow skills/script-writing/references/review.md. Do not change author files, sources, script or visual intent.
      The exact review binding is $script-binding.output.artifacts.binding. Create or replace jobs/scripts/$INPUTS.project/review.md using file tools. Include a standalone line "Binding: $script-binding.output.artifacts.binding", concrete findings supported by the files you actually inspected, and a final line "Disposition: pass", "Disposition: revise" or "Disposition: incomplete". A missing previous report is expected; you are responsible for creating it. If evidence is genuinely missing, still write a binding-tagged incomplete report naming what is missing. Do not claim inspection you did not perform.
      Finish with a short plain-language confirmation of the report path. Do not return JSON; the next deterministic node reads your report and produces the machine result.
  -
    id: "script-report"
    when: "$script-binding.output.artifacts.ready == false"
    depends_on:
      - "script-review"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("script-reviewed", {expected: process.env.INPUTS_BINDING});
    with:
      binding: "$script-binding.output.artifacts.binding"
  -
    id: "script-reviewed-state"
    depends_on:
      - "script-binding"
      - "script-report"
    always_run: true
    trigger_rule: "none_failed_min_one_success"
    bash: 'node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"'
  -
    id: "script-gate"
    depends_on:
      - "script-reviewed-state"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("gate", {kind:"script"});
  -
    id: "script-attention"
    depends_on:
      - "script-gate"
    when: "$script-reviewed-state.output.artifacts.ready == true && $script-gate.output.artifacts.needsAnswer == true"
    wait:
      form: "select"
      attention: "Review $script-gate.output.artifacts.artifact for $INPUTS.project. Binding: $script-gate.output.artifacts.binding. Choose approve, revise or reject. Approval needs no comment; revisions require your actual feedback."
      options:
        -
          id: "approve"
          label: "Approve"
        -
          id: "revise"
          label: "Request changes"
        -
          id: "reject"
          label: "Stop"
  -
    id: "script-answer"
    depends_on:
      - "script-gate"
      - "script-attention"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("checkpoint", {kind:"script", expected: process.env.INPUTS_BINDING, answer: JSON.parse(process.env.INPUTS_ANSWER)});
    when: "$script-reviewed-state.output.artifacts.ready == true && $script-gate.output.artifacts.needsAnswer == true"
    trigger_rule: "none_failed_min_one_success"
    with:
      binding: "$script-gate.output.artifacts.binding"
      answer: "$script-attention.output"
  -
    id: "script-stop"
    depends_on:
      - "script-answer"
    when: "$script-answer.output.artifacts.rejected == true"
    cancel: "Operator stopped this production; retained artifacts remain available."
  -
    id: "script-accepted"
    depends_on:
      - "script-gate"
      - "script-answer"
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("gate", {kind:"script"});
    trigger_rule: "none_failed_min_one_success"
  -
    id: "round-result"
    depends_on:
      - "script-accepted"
    always_run: true
    bash: "node scripts/archon/rules-story.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
returns: "round-result"
