name: rules-story
description: Produce rules-story films with measured narration, independent evidence-bound review, human decisions and unlisted delivery.
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: 'Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut'
    default: '{}'
nodes:
- id: recover
  depends_on: []
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
- id: research-state
  depends_on:
  - recover
  always_run: true
  bash: node scripts/archon/rules-story.mjs research-status "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: research
  depends_on:
  - research-state
  when: $research-state.output.artifacts.done == false
  context: fresh
  command: research
  skills:
  - script-writing
  retry:
    max_attempts: 2
    on_error: transient
- id: research-recheck
  depends_on:
  - research-state
  - research
  always_run: true
  bash: node scripts/archon/rules-story.mjs research-status "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: research-fix
  depends_on:
  - research-recheck
  when: $research-recheck.output.artifacts.done == false
  context: fresh
  command: research-fix
  skills:
  - script-writing
  retry:
    max_attempts: 2
    on_error: transient
- id: research-ready
  depends_on:
  - research-recheck
  - research-fix
  always_run: true
  bash: node scripts/archon/rules-story.mjs research-status "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: identity
  depends_on:
  - research-ready
  always_run: true
  bash: node scripts/archon/rules-story.mjs identity "$INPUTS_PROJECT" --route
- id: identity-fix
  depends_on:
  - identity
  when: $identity.output.status == 'repair'
  context: fresh
  command: identity-fix
  retry:
    max_attempts: 2
    on_error: transient
- id: identity-final
  depends_on:
  - identity-fix
  when: $identity.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs identity "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: script-cycle
  depends_on:
  - identity
  - identity-final
  trigger_rule: none_failed_min_one_success
  loop_group:
    max_iterations: 4
    until_bash: node scripts/archon/rules-story.mjs script-loop-check "$INPUTS_PROJECT"
    nodes:
    - id: script-answer
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        const answer = process.env.INPUTS_ANSWER;
        await emit("answer", {kind:"script", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
      with:
        binding: $LOOP_PREV.script-gate.output.artifacts.binding
        answer: $LOOP_PREV.script-attention.output
    - id: script-stop
      depends_on:
      - script-answer
      when: $script-answer.output.artifacts.rejected == true
      cancel: Operator stopped this production; retained artifacts remain available.
    - id: script-state
      depends_on:
      - script-answer
      - script-stop
      trigger_rule: none_failed_min_one_success
      always_run: true
      bash: node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"
    - id: write
      depends_on:
      - script-state
      context: fresh
      command: write
      skills:
      - script-writing
      when: $script-state.output.artifacts.needsWrite == true
      retry:
        max_attempts: 2
        on_error: transient
    - id: script-binding
      depends_on:
      - script-state
      - write
      always_run: true
      bash: node scripts/archon/rules-story.mjs script-review-request "$INPUTS_PROJECT"
      trigger_rule: none_failed_min_one_success
    - id: script-review
      when: $script-binding.output.artifacts.needsReview == true
      always_run: true
      depends_on:
      - script-binding
      context: fresh
      command: script-review
      skills:
      - script-writing
    - id: script-report
      when: $script-binding.output.artifacts.needsReview == true
      depends_on:
      - script-review
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        await emit("script-reviewed", {expected: process.env.INPUTS_BINDING});
      with:
        binding: $script-binding.output.artifacts.binding
    - id: script-fix-state
      depends_on:
      - script-binding
      - script-report
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"
    - id: script-fix
      depends_on:
      - script-fix-state
      context: fresh
      retry:
        max_attempts: 2
        on_error: transient
      when: $script-fix-state.output.artifacts.needsFix == true
      command: script-fix
      skills:
      - script-writing
    - id: script-continue
      depends_on:
      - script-fix-state
      - script-fix
      always_run: true
      trigger_rule: none_failed_min_one_success
      when: $script-fix-state.output.artifacts.needsContinuation == true
      bash: node scripts/archon/rules-story.mjs script-continue "$INPUTS_PROJECT"
    - id: script-reviewed-state
      depends_on:
      - script-fix-state
      - script-continue
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"
    - id: script-gate
      depends_on:
      - script-reviewed-state
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        await emit("gate", {kind:"script"});
    - id: script-attention
      depends_on:
      - script-gate
      when: $script-reviewed-state.output.artifacts.ready == true && $script-gate.output.artifacts.needsAnswer == true
      wait:
        form: select
        attention: 'Review $script-gate.output.artifacts.artifact for $INPUTS.project. Binding: $script-gate.output.artifacts.binding. Choose approve, revise or reject. Approval needs no comment; revisions require your actual feedback.'
        options:
        - id: approve
          label: Approve
        - id: revise
          label: Request changes
        - id: reject
          label: Stop
- id: narration
  depends_on:
  - script-cycle
  always_run: true
  bash: node scripts/archon/rules-story.mjs narration "$INPUTS_PROJECT" --route
  retry:
    max_attempts: 1
    on_error: all
- id: narration-fix
  depends_on:
  - narration
  when: $narration.output.artifacts.needsScriptFix == true
  context: fresh
  command: narration-fix
  skills:
  - script-writing
  retry:
    max_attempts: 2
    on_error: transient
- id: narration-final
  depends_on:
  - narration
  - narration-fix
  when: $narration.output.status == 'repair'
  always_run: true
  trigger_rule: none_failed_min_one_success
  bash: node scripts/archon/rules-story.mjs narration "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: prepare
  depends_on:
  - narration
  - narration-final
  always_run: true
  bash: node scripts/archon/rules-story.mjs prepare "$INPUTS_PROJECT" --route
  trigger_rule: none_failed_min_one_success
- id: prepare-fix
  depends_on:
  - prepare
  when: $prepare.output.status == 'repair'
  context: fresh
  command: prepare-fix
  retry:
    max_attempts: 2
    on_error: transient
- id: prepare-final
  depends_on:
  - prepare-fix
  when: $prepare.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs prepare "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: timing
  depends_on:
  - prepare
  - prepare-final
  always_run: true
  trigger_rule: none_failed_min_one_success
  bash: node scripts/archon/rules-story.mjs asr-timing "$INPUTS_PROJECT" --route
- id: timing-fix
  depends_on:
  - timing
  when: $timing.output.status == 'repair'
  context: fresh
  command: timing-fix
  retry:
    max_attempts: 2
    on_error: transient
- id: timing-final
  depends_on:
  - timing-fix
  when: $timing.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs asr-timing "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: audio-evidence
  depends_on:
  - timing
  - timing-final
  trigger_rule: none_failed_min_one_success
  always_run: true
  bash: node scripts/archon/rules-story.mjs audio-evidence "$INPUTS_PROJECT"
- id: audio-review
  depends_on:
  - audio-evidence
  always_run: true
  bash: node scripts/archon/rules-story.mjs audio-review "$INPUTS_PROJECT" --route
- id: audio-redo
  depends_on:
  - audio-review
  when: $audio-review.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs audio-redo "$INPUTS_PROJECT"
- id: audio-evidence-final
  depends_on:
  - audio-redo
  when: $audio-review.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs audio-evidence "$INPUTS_PROJECT"
- id: audio-review-final
  depends_on:
  - audio-evidence-final
  when: $audio-review.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs audio-review "$INPUTS_PROJECT" '{"final":true}'
- id: audio-reviewed
  depends_on:
  - audio-review
  - audio-review-final
  always_run: true
  bash: node scripts/archon/rules-story.mjs audio-reviewed "$INPUTS_PROJECT"
  trigger_rule: none_failed_min_one_success
- id: sound
  depends_on:
  - audio-reviewed
  always_run: true
  bash: node scripts/archon/rules-story.mjs sound "$INPUTS_PROJECT" --route
  retry:
    max_attempts: 1
    on_error: all
- id: sound-fix
  depends_on:
  - sound
  when: $sound.output.status == 'repair'
  context: fresh
  command: sound-fix
  retry:
    max_attempts: 2
    on_error: transient
- id: sound-final
  depends_on:
  - sound-fix
  when: $sound.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs sound "$INPUTS_PROJECT" '{"final":true}'
  retry:
    max_attempts: 1
    on_error: all
- id: production-state
  depends_on:
  - sound
  - sound-final
  trigger_rule: none_failed_min_one_success
  always_run: true
  bash: node scripts/archon/rules-story.mjs production-result "$INPUTS_PROJECT"
- id: register-director
  depends_on:
  - production-state
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("producer", {role:"director",runId:process.env.INPUTS_RUN});
  with:
    run: $WORKFLOW_ID
  when: $production-state.output.artifacts.done == false
- id: direction
  depends_on:
  - production-state
  - register-director
  context: fresh
  command: direction
  skills:
  - hyperframes
  trigger_rule: none_failed_min_one_success
  when: $production-state.output.artifacts.done == false
  retry:
    max_attempts: 2
    on_error: transient
- id: series
  depends_on:
  - production-state
  - direction
  always_run: true
  bash: node scripts/archon/rules-story.mjs series "$INPUTS_PROJECT" --route
  trigger_rule: none_failed_min_one_success
  when: $production-state.output.artifacts.done == false
- id: direction-fix
  depends_on:
  - series
  when: $series.output.status == 'repair'
  context: fresh
  command: direction-fix
  skills:
  - hyperframes
  retry:
    max_attempts: 2
    on_error: transient
- id: series-final
  depends_on:
  - direction-fix
  when: $series.output.status == 'repair'
  always_run: true
  bash: node scripts/archon/rules-story.mjs series "$INPUTS_PROJECT" '{"final":true}'
- id: register-scenes
  depends_on:
  - production-state
  - series
  - series-final
  always_run: true
  runtime: bun
  script: |-
    const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
    await emit("producer", {role:"scene-author",runId:process.env.INPUTS_RUN});
  with:
    run: $WORKFLOW_ID
  trigger_rule: none_failed_min_one_success
  when: $production-state.output.artifacts.done == false
- id: scenes
  depends_on:
  - register-scenes
  when: $production-state.output.artifacts.done == false
  context: fresh
  command: scenes
  skills:
  - hyperframes
  retry:
    max_attempts: 2
    on_error: transient
- id: production
  depends_on:
  - production-state
  - register-scenes
  - scenes
  workflow: rules-story-production-round
  isolation: inherit
  with:
    project: $INPUTS.project
    options: $INPUTS.options
  trigger_rule: none_failed_min_one_success
  when: $production-state.output.artifacts.done == false
- id: delivery
  depends_on:
  - production-state
  - production
  trigger_rule: none_failed_min_one_success
  always_run: true
  bash: node scripts/archon/rules-story.mjs deliver "$INPUTS_PROJECT"
  retry:
    max_attempts: 1
    on_error: all
- id: thumbnail-cycle
  depends_on:
  - delivery
  loop_group:
    max_iterations: 4
    until_bash: node scripts/archon/rules-story.mjs thumbnail-loop-check "$INPUTS_PROJECT"
    nodes:
    - id: thumbnail-answer
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        const answer = process.env.INPUTS_ANSWER;
        await emit("answer", {kind:"thumbnail", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
      with:
        binding: $LOOP_PREV.thumbnail-gate.output.artifacts.binding
        answer: $LOOP_PREV.thumbnail-attention.output
    - id: thumbnail-stop
      depends_on:
      - thumbnail-answer
      when: $thumbnail-answer.output.artifacts.rejected == true
      cancel: Operator stopped this production; retained artifacts remain available.
    - id: thumbnail-state
      depends_on:
      - thumbnail-answer
      - thumbnail-stop
      trigger_rule: none_failed_min_one_success
      always_run: true
      bash: node scripts/archon/rules-story.mjs thumbnail-loop-result "$INPUTS_PROJECT"
    - id: thumbnail-generate
      depends_on:
      - thumbnail-state
      context: fresh
      command: thumbnail-generate
      skills:
      - thumbnails
      retry:
        max_attempts: 2
        on_error: transient
      when: $thumbnail-state.output.artifacts.needsGenerate == true
    - id: thumbnail-review-state
      depends_on:
      - thumbnail-state
      - thumbnail-generate
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/rules-story.mjs thumbnail-status "$INPUTS_PROJECT"
    - id: thumbnail-review
      depends_on:
      - thumbnail-review-state
      context: fresh
      command: thumbnail-review
      skills:
      - thumbnails
      retry:
        max_attempts: 2
        on_error: transient
      when: $thumbnail-review-state.output.artifacts.needsReview == true
    - id: thumbnail-join
      depends_on:
      - thumbnail-review-state
      - thumbnail-review
      always_run: true
      bash: node scripts/archon/rules-story.mjs thumbnail-status "$INPUTS_PROJECT"
      trigger_rule: none_failed_min_one_success
    - id: thumbnail-fix-request
      depends_on:
      - thumbnail-join
      always_run: true
      when: $thumbnail-join.output.artifacts.needsFix == true
      bash: node scripts/archon/rules-story.mjs thumbnail-fix-request "$INPUTS_PROJECT"
    - id: thumbnail-fix
      depends_on:
      - thumbnail-fix-request
      context: fresh
      retry:
        max_attempts: 2
        on_error: transient
      when: $thumbnail-join.output.artifacts.needsFix == true
      command: thumbnail-fix
      skills:
      - thumbnails
    - id: thumbnail-fixed
      depends_on:
      - thumbnail-fix
      always_run: true
      when: $thumbnail-join.output.artifacts.needsFix == true
      bash: node scripts/archon/rules-story.mjs thumbnail-fixed "$INPUTS_PROJECT"
    - id: thumbnail-select
      depends_on:
      - thumbnail-join
      - thumbnail-fixed
      always_run: true
      trigger_rule: none_failed_min_one_success
      bash: node scripts/archon/rules-story.mjs thumbnail-loop-result "$INPUTS_PROJECT"
    - id: thumbnail-gate
      depends_on:
      - thumbnail-select
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        await emit("gate", {kind:"thumbnail"});
    - id: thumbnail-attention
      depends_on:
      - thumbnail-gate
      when: $thumbnail-select.output.artifacts.selectable == true && $thumbnail-gate.output.artifacts.needsAnswer == true
      wait:
        form: select
        attention: 'Review $thumbnail-gate.output.artifacts.artifact for $INPUTS.project. Binding: $thumbnail-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback.'
        options: $thumbnail-gate.output.artifacts.options
- id: publishing-cycle
  depends_on:
  - thumbnail-cycle
  loop_group:
    max_iterations: 4
    until_bash: node scripts/archon/rules-story.mjs publishing-loop-check "$INPUTS_PROJECT"
    nodes:
    - id: publishing-answer
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        const answer = process.env.INPUTS_ANSWER;
        await emit("answer", {kind:"publishing", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
      with:
        binding: $LOOP_PREV.publishing-gate.output.artifacts.binding
        answer: $LOOP_PREV.publishing-attention.output
    - id: publishing-stop
      depends_on:
      - publishing-answer
      when: $publishing-answer.output.artifacts.rejected == true
      cancel: Operator stopped this production; retained artifacts remain available.
    - id: publishing-state
      depends_on:
      - publishing-answer
      - publishing-stop
      trigger_rule: none_failed_min_one_success
      always_run: true
      bash: node scripts/archon/rules-story.mjs publishing-loop-result "$INPUTS_PROJECT"
    - id: publishing-copy
      depends_on:
      - publishing-state
      context: fresh
      command: publishing-copy
      skills:
      - publishing
      when: $publishing-state.output.artifacts.done == false
      retry:
        max_attempts: 2
        on_error: transient
    - id: publishing-gate
      depends_on:
      - publishing-state
      - publishing-copy
      always_run: true
      runtime: bun
      script: |-
        const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
        await emit("gate", {kind:"publishing"});
      trigger_rule: none_failed_min_one_success
    - id: publishing-attention
      depends_on:
      - publishing-gate
      when: $publishing-gate.output.artifacts.needsAnswer == true
      wait:
        form: select
        attention: 'Review $publishing-gate.output.artifacts.artifact for $INPUTS.project. Binding: $publishing-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback.'
        options:
        - id: approve
          label: Approve unlisted upload
        - id: revise
          label: Revise copy
        - id: opt-out
          label: Keep local only
        - id: reject
          label: Stop
- id: publish
  depends_on:
  - publishing-cycle
  always_run: true
  bash: node scripts/archon/rules-story.mjs publish "$INPUTS_PROJECT"
  retry:
    max_attempts: 1
    on_error: all
