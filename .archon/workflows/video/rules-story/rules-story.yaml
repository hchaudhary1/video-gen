# Explicit Archon nodes; bounded rounds retain durable human checkpoints.
name: "rules-story"
description: "Produce rules-story films with measured narration, independent evidence-bound review, human decisions and unlisted delivery."
worktree:
  enabled: false
inputs:
  project:
    description: "Explicit lowercase project slug"
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  -
    id: "recover"
    depends_on: []
    always_run: true
    runtime: "bun"
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
  -
    id: "research"
    depends_on:
      - "recover"
    context: "fresh"
    prompt: |-
      Project: $INPUTS.project. Read AGENTS.md, docs/production.md and the saved production-profile.json / PROFILE.md. Work only in this project's folders. Follow the applicable repository skill. Preserve supplied recordings, approved narration, evidence and provenance. Never answer human attention on their behalf. Archon owns stage progression. Complete only this node's assignment. Use direct library functions and the documented Archon adapters. Use actual image viewing capability for inspection; disclose unavailable inspection instead of claiming a pass.
      Read skills/script-writing/SKILL.md. Research the agreed BRIEF.md or supplied script. Retain evidence and SOURCES.md; distinguish invented lore from real claims. Save identity.json naming an existing suitable series identity (and optional parent for a Short); create a new identity with lib/identities.mjs only if needed.
  -
    id: "identity"
    depends_on:
      - "research"
    always_run: true
    bash: "node scripts/archon/rules-story.mjs identity \"$INPUTS_PROJECT\""
  -
    id: "script-cycle-state-1"
    depends_on:
      - "identity"
    always_run: true
    bash: "node scripts/archon/rules-story.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-1"
    depends_on:
      - "script-cycle-state-1"
    when: "$script-cycle-state-1.output.artifacts.done == false"
    workflow: "rules-story-script-cycle-round"
    isolation: "inherit"
    with:
      project: "$INPUTS.project"
      options: "$INPUTS.options"
  -
    id: "script-cycle-state-2"
    depends_on:
      - "script-cycle-state-1"
      - "script-cycle-round-1"
    always_run: true
    bash: "node scripts/archon/rules-story.mjs script-loop-result \"$INPUTS_PROJECT\""
    trigger_rule: "none_failed_min_one_success"
  -
    id: "script-cycle-round-2"
    depends_on:
      - "script-cycle-state-2"
    when: "$script-cycle-state-2.output.artifacts.done == false"
    workflow: "rules-story-script-cycle-round"
