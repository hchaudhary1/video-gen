name: rules-story
description: Produce rules-story films with measured narration, independent evidence-bound review, human decisions and unlisted delivery.
mutates_checkout: false
worktree:
  enabled: false
inputs:
  project:
    description: Explicit lowercase project slug
    required: true
  options:
    description: "Creation options JSON: brief/brief-file, script/audio, review, duration, format, thumbnails, optOut"
    default: "{}"
nodes:
  - id: recover
    description: Create the project on first run (or load the saved one) and freeze the treatment profile and options, so a resumed run continues the same production.
    depends_on: []
    always_run: true
    runtime: bun
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("init", JSON.parse(process.env.INPUTS_OPTIONS || "{}"));
  - id: research-state
    description: Check whether research is already complete (SOURCES.md, evidence, identity.json for rules-story) so a resumed run skips it.
    depends_on:
      - recover
    always_run: true
    bash: node scripts/archon/rules-story.mjs research-status "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: research
    description: Research the brief and retain sources.
    depends_on:
      - research-state
    when: $research-state.output.artifacts.done == false
    context: fresh
    command: research
    skills:
      - script-writing
    retry:
      max_attempts: 2
      on_error: transient
  - id: research-recheck
    description: Re-check the research files the author just produced; any errors trigger the one fix pass.
    depends_on:
      - research-state
      - research
    always_run: true
    bash: node scripts/archon/rules-story.mjs research-status "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: research-fix
    description: The one fix pass for research files the check still reports missing.
    depends_on:
      - research-recheck
    when: $research-recheck.output.artifacts.done == false
    context: fresh
    command: research-fix
    skills:
      - script-writing
    retry:
      max_attempts: 2
      on_error: transient
  - id: research-ready
    description: Final research check after the fix pass; production continues whatever it reports, and script review sees any gap.
    depends_on:
      - research-recheck
      - research-fix
    always_run: true
    bash: node scripts/archon/rules-story.mjs research-status "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: identity
    description: "Continue the series identity named in identity.json: assign this film its file number, overlay label and sound. Errors route to identity-fix."
    depends_on:
      - research-ready
    always_run: true
    bash: node scripts/archon/rules-story.mjs identity "$INPUTS_PROJECT" --route
  - id: identity-fix
    description: The one agent fix for an identity that could not be continued.
    depends_on:
      - identity
    when: $identity.output.status == 'repair'
    context: fresh
    command: identity-fix
    retry:
      max_attempts: 2
      on_error: transient
  - id: identity-final
    description: Second and last identity attempt after the fix; failure now stops the run.
    depends_on:
      - identity-fix
    when: $identity.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs identity "$INPUTS_PROJECT" '{"final":true}'
    retry:
      max_attempts: 1
      on_error: all
  - id: script-cycle
    description: Write → independent review → one fix → optional operator approval. Repeats only when the operator asks for revisions (max passes shown).
    depends_on:
      - identity
      - identity-final
    trigger_rule: none_failed_min_one_success
    loop_group:
      max_iterations: 4
      until_bash: node scripts/archon/rules-story.mjs script-loop-check "$INPUTS_PROJECT"
      nodes:
        - id: script-answer
          description: Record the operator's answer from the previous pass (bound to the exact script hash they saw) into archon/script-decision.json. No-op on the first pass.
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            const answer = process.env.INPUTS_ANSWER;
            await emit("answer", {kind:"script", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
          with:
            binding: $LOOP_PREV.script-gate.output.artifacts.binding
            answer: $LOOP_PREV.script-attention.output
        - id: script-stop
          description: "Operator chose Stop: end the run, keeping all artifacts."
          depends_on:
            - script-answer
          when: $script-answer.output.artifacts.rejected == true
          cancel: Operator stopped this production; retained artifacts remain available.
        - id: script-state
          description: "Compute what the script needs now: write (missing / revision requested), review, or fix. Also gives the writer supplied/canRevise/feedback."
          depends_on:
            - script-answer
            - script-stop
          trigger_rule: none_failed_min_one_success
          always_run: true
          bash: node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"
        - id: write
          description: Write or revise SCRIPT.md, research.md and VISUALS.md.
          depends_on:
            - script-state
          context: fresh
          command: write
          skills:
            - script-writing
          when: $script-state.output.artifacts.needsWrite == true
          retry:
            max_attempts: 2
            on_error: transient
        - id: script-binding
          description: Hash the current script files and save archon/script-review-request.json, so the review is bound to exactly this text.
          depends_on:
            - script-state
            - write
          always_run: true
          bash: node scripts/archon/rules-story.mjs script-review-request "$INPUTS_PROJECT"
          trigger_rule: none_failed_min_one_success
        - id: script-review
          description: Independent, text-only script review.
          when: $script-binding.output.artifacts.needsReview == true
          always_run: true
          depends_on:
            - script-binding
          context: fresh
          command: script-review
          skills:
            - script-writing
        - id: script-report
          description: Check the script did not change during review, then read review.md's binding and disposition into archon/script-review.json (a missing or unbound report counts as incomplete).
          when: $script-binding.output.artifacts.needsReview == true
          depends_on:
            - script-review
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            await emit("script-reviewed", {expected: process.env.INPUTS_BINDING});
          with:
            binding: $script-binding.output.artifacts.binding
        - id: script-fix-state
          description: "Re-read script state after review: decides whether the one author fix is needed and allowed (supplied scripts are never auto-edited)."
          depends_on:
            - script-binding
            - script-report
          always_run: true
          trigger_rule: none_failed_min_one_success
          bash: node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"
        - id: script-fix
          description: The one author fix after the independent review.
          depends_on:
            - script-fix-state
          context: fresh
          retry:
            max_attempts: 2
            on_error: transient
          when: $script-fix-state.output.artifacts.needsFix == true
          command: script-fix
          skills:
            - script-writing
        - id: script-continue
          description: "Accept the script without another review: record archon/script-revision.json saying it was revised (or retained) after the review."
          depends_on:
            - script-fix-state
            - script-fix
          always_run: true
          trigger_rule: none_failed_min_one_success
          when: $script-fix-state.output.artifacts.needsContinuation == true
          bash: node scripts/archon/rules-story.mjs script-continue "$INPUTS_PROJECT"
        - id: script-reviewed-state
          description: "Final script state: is the current text accepted (reviewed, or fixed after review)?"
          depends_on:
            - script-fix-state
            - script-continue
          always_run: true
          trigger_rule: none_failed_min_one_success
          bash: node scripts/archon/rules-story.mjs script-status "$INPUTS_PROJECT"
        - id: script-gate
          description: Hash the accepted script and check whether operator approval is required and already given for this exact text.
          depends_on:
            - script-reviewed-state
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            await emit("gate", {kind:"script"});
        - id: script-attention
          description: Ask the operator to approve, revise or stop the script.
          depends_on:
            - script-gate
          when: $script-reviewed-state.output.artifacts.ready == true && $script-gate.output.artifacts.needsAnswer == true
          wait:
            form: select
            attention: "Review $script-gate.output.artifacts.artifact for $INPUTS.project. Binding: $script-gate.output.artifacts.binding. Choose approve, revise or reject. Approval needs no comment; revisions require your actual feedback."
            options:
              - id: approve
                label: Approve
              - id: revise
                label: Request changes
              - id: reject
                label: Stop
  - id: narration
    description: "Generate the narration take (rules-story: Ming TTS → narration.wav; Kai: explainroo voice per scene) after checking the script is reviewed and approved. A duration miss >20% or bad narration text routes to narration-fix."
    depends_on:
      - script-cycle
    always_run: true
    bash: node scripts/archon/rules-story.mjs narration "$INPUTS_PROJECT" --route
    retry:
      max_attempts: 1
      on_error: all
  - id: narration-fix
    description: The one script edit to fix narration length or text.
    depends_on:
      - narration
    when: $narration.output.artifacts.needsScriptFix == true
    context: fresh
    command: narration-fix
    skills:
      - script-writing
    retry:
      max_attempts: 2
      on_error: transient
  - id: narration-final
    description: Regenerate the narration once after the fix; keeps whatever length it measures and discloses any miss.
    depends_on:
      - narration
      - narration-fix
    when: $narration.output.status == 'repair'
    always_run: true
    trigger_rule: none_failed_min_one_success
    bash: node scripts/archon/rules-story.mjs narration "$INPUTS_PROJECT" '{"final":true}'
    retry:
      max_attempts: 1
      on_error: all
  - id: prepare
    description: Create the job folder jobs/<slug> (job.json, canvas, narration copy) from the reviewed script and take, and verify script/audio hashes match. Errors route to prepare-fix.
    depends_on:
      - narration
      - narration-final
    always_run: true
    bash: node scripts/archon/rules-story.mjs prepare "$INPUTS_PROJECT" --route
    trigger_rule: none_failed_min_one_success
  - id: prepare-fix
    description: The one agent fix for a failed job preparation.
    depends_on:
      - prepare
    when: $prepare.output.status == 'repair'
    context: fresh
    command: prepare-fix
    retry:
      max_attempts: 2
      on_error: transient
  - id: prepare-final
    description: Second and last preparation attempt.
    depends_on:
      - prepare-fix
    when: $prepare.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs prepare "$INPUTS_PROJECT" '{"final":true}'
    retry:
      max_attempts: 1
      on_error: all
  - id: timing
    description: "Measure word timing: ASR transcript + forced alignment against the script (transcript.json, alignment.json). Skipped when inputs are unchanged. Errors route to timing-fix."
    depends_on:
      - prepare
      - prepare-final
    always_run: true
    trigger_rule: none_failed_min_one_success
    bash: node scripts/archon/rules-story.mjs asr-timing "$INPUTS_PROJECT" --route
  - id: timing-fix
    description: The one agent fix for failed ASR/alignment.
    depends_on:
      - timing
    when: $timing.output.status == 'repair'
    context: fresh
    command: timing-fix
    retry:
      max_attempts: 2
      on_error: transient
  - id: timing-final
    description: Second and last timing attempt.
    depends_on:
      - timing-fix
    when: $timing.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs asr-timing "$INPUTS_PROJECT" '{"final":true}'
    retry:
      max_attempts: 1
      on_error: all
  - id: audio-evidence
    description: Record script/recording hashes and per-scene speech match rates (ASR vs script) as review evidence.
    depends_on:
      - timing
      - timing-final
    trigger_rule: none_failed_min_one_success
    always_run: true
    bash: node scripts/archon/rules-story.mjs audio-evidence "$INPUTS_PROJECT"
  - id: audio-review
    description: "Deterministic speech check: every narrated scene must reach 90% coverage. Below that routes to one fix."
    depends_on:
      - audio-evidence
    always_run: true
    bash: node scripts/archon/rules-story.mjs audio-review "$INPUTS_PROJECT" --route
  - id: audio-redo
    description: "Rules-story fix: archive the weak take and generate, prepare and time one new Ming take."
    depends_on:
      - audio-review
    when: $audio-review.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs audio-redo "$INPUTS_PROJECT"
  - id: audio-evidence-final
    description: Re-measure speech coverage for the new take.
    depends_on:
      - audio-redo
    when: $audio-review.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs audio-evidence "$INPUTS_PROJECT"
  - id: audio-review-final
    description: "Final speech check: scenes ≥50% are accepted with the gap disclosed; below 50% stops the run."
    depends_on:
      - audio-evidence-final
    when: $audio-review.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs audio-review "$INPUTS_PROJECT" '{"final":true}'
  - id: audio-reviewed
    description: Validate the audio-review receipt matches the current script and recording before any visual work.
    depends_on:
      - audio-review
      - audio-review-final
    always_run: true
    bash: node scripts/archon/rules-story.mjs audio-reviewed "$INPUTS_PROJECT"
    trigger_rule: none_failed_min_one_success
  - id: sound
    description: Render the series identity's sound kit (drone, stings, effects) into the job; cached by identity + duration. Errors route to sound-fix.
    depends_on:
      - audio-reviewed
    always_run: true
    bash: node scripts/archon/rules-story.mjs sound "$INPUTS_PROJECT" --route
    retry:
      max_attempts: 1
      on_error: all
  - id: sound-fix
    description: The one agent fix for a failed sound-kit render.
    depends_on:
      - sound
    when: $sound.output.status == 'repair'
    context: fresh
    command: sound-fix
    retry:
      max_attempts: 2
      on_error: transient
  - id: sound-final
    description: Second and last sound-kit attempt.
    depends_on:
      - sound-fix
    when: $sound.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs sound "$INPUTS_PROJECT" '{"final":true}'
    retry:
      max_attempts: 1
      on_error: all
  - id: production-state
    description: Is a current, technically verified (and, if required, approved) render already delivered? If so, skip all production.
    depends_on:
      - sound
      - sound-final
    trigger_rule: none_failed_min_one_success
    always_run: true
    bash: node scripts/archon/rules-story.mjs production-result "$INPUTS_PROJECT"
  - id: register-director
    description: Register the director as a producer of this job, so it can never act as an independent reviewer.
    depends_on:
      - production-state
    always_run: true
    runtime: bun
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("producer", {role:"director",runId:process.env.INPUTS_RUN});
    with:
      run: $WORKFLOW_ID
    when: $production-state.output.artifacts.done == false
  - id: direction
    description: Direct the film / author the scenes.
    depends_on:
      - production-state
      - register-director
    context: fresh
    command: direction
    skills:
      - hyperframes
      - typography
    trigger_rule: none_failed_min_one_success
    when: $production-state.output.artifacts.done == false
    retry:
      max_attempts: 2
      on_error: transient
  - id: series
    description: Install the rules-series-kit (HUD, captions, rule card, overlay) from film.json/series.json. Errors route to direction-fix.
    depends_on:
      - production-state
      - direction
    always_run: true
    bash: node scripts/archon/rules-story.mjs series "$INPUTS_PROJECT" --route
    trigger_rule: none_failed_min_one_success
    when: $production-state.output.artifacts.done == false
  - id: direction-fix
    description: The one director fix for an invalid series kit setup.
    depends_on:
      - series
    when: $series.output.status == 'repair'
    context: fresh
    command: direction-fix
    skills:
      - hyperframes
      - typography
    retry:
      max_attempts: 2
      on_error: transient
  - id: series-final
    description: Second and last series-kit attempt.
    depends_on:
      - direction-fix
    when: $series.output.status == 'repair'
    always_run: true
    bash: node scripts/archon/rules-story.mjs series "$INPUTS_PROJECT" '{"final":true}'
  - id: register-scenes
    description: Register the scene author as a producer, so it can never review its own film.
    depends_on:
      - production-state
      - series
      - series-final
    always_run: true
    runtime: bun
    script: |-
      const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
      await emit("producer", {role:"scene-author",runId:process.env.INPUTS_RUN});
    with:
      run: $WORKFLOW_ID
    trigger_rule: none_failed_min_one_success
    when: $production-state.output.artifacts.done == false
  - id: scenes
    description: Author the native HTML scenes.
    depends_on:
      - register-scenes
    when: $production-state.output.artifacts.done == false
    context: fresh
    command: scenes
    skills:
      - hyperframes
      - typography
    retry:
      max_attempts: 2
      on_error: transient
  - id: production
    description: "Run one production round: build, freeze, independent visual review, one revision, optional film approval, render and verify."
    depends_on:
      - production-state
      - register-scenes
      - scenes
    workflow: rules-story-production-round
    isolation: inherit
    with:
      project: $INPUTS.project
      options: $INPUTS.options
    trigger_rule: none_failed_min_one_success
    when: $production-state.output.artifacts.done == false
  - id: delivery
    description: Re-verify the rendered video against current sources and approvals, write review/delivery.json and mark job.json complete.
    depends_on:
      - production-state
      - production
    trigger_rule: none_failed_min_one_success
    always_run: true
    bash: node scripts/archon/rules-story.mjs deliver "$INPUTS_PROJECT"
    retry:
      max_attempts: 1
      on_error: all
  - id: thumbnail-cycle
    description: Generate → independent review → one fix → select. Repeats only when the operator asks for new thumbnails.
    depends_on:
      - delivery
    loop_group:
      max_iterations: 4
      until_bash: node scripts/archon/rules-story.mjs thumbnail-loop-check "$INPUTS_PROJECT"
      nodes:
        - id: thumbnail-answer
          description: Record the operator's thumbnail choice or feedback from the previous pass (bound to the variants they saw).
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            const answer = process.env.INPUTS_ANSWER;
            await emit("answer", {kind:"thumbnail", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
          with:
            binding: $LOOP_PREV.thumbnail-gate.output.artifacts.binding
            answer: $LOOP_PREV.thumbnail-attention.output
        - id: thumbnail-stop
          description: "Operator chose Stop: end the run, keeping all artifacts."
          depends_on:
            - thumbnail-answer
          when: $thumbnail-answer.output.artifacts.rejected == true
          cancel: Operator stopped this production; retained artifacts remain available.
        - id: thumbnail-state
          description: Which variants are missing or have operator feedback and need (re)generating?
          depends_on:
            - thumbnail-answer
            - thumbnail-stop
          trigger_rule: none_failed_min_one_success
          always_run: true
          bash: node scripts/archon/rules-story.mjs thumbnail-loop-result "$INPUTS_PROJECT"
        - id: thumbnail-generate
          description: Make or remake thumbnail variants.
          depends_on:
            - thumbnail-state
          context: fresh
          command: thumbnail-generate
          skills:
            - thumbnails
            - typography
          retry:
            max_attempts: 2
            on_error: transient
          when: $thumbnail-state.output.artifacts.needsGenerate == true
        - id: thumbnail-review-state
          description: Flag PNGs over 2 MB as technical feedback and decide whether any made variant still needs review.
          depends_on:
            - thumbnail-state
            - thumbnail-generate
          always_run: true
          trigger_rule: none_failed_min_one_success
          bash: node scripts/archon/rules-story.mjs thumbnail-status "$INPUTS_PROJECT"
        - id: thumbnail-review
          description: Independent thumbnail review and ranking.
          depends_on:
            - thumbnail-review-state
          context: fresh
          command: thumbnail-review
          skills:
            - thumbnails
          retry:
            max_attempts: 2
            on_error: transient
          when: $thumbnail-review-state.output.artifacts.needsReview == true
        - id: thumbnail-join
          description: "After review: did any variant pass? If none did, the one fix is needed."
          depends_on:
            - thumbnail-review-state
            - thumbnail-review
          always_run: true
          bash: node scripts/archon/rules-story.mjs thumbnail-status "$INPUTS_PROJECT"
          trigger_rule: none_failed_min_one_success
        - id: thumbnail-fix-request
          description: Save which reviewed set the fix responds to (review/thumbnail-fix-request.json).
          depends_on:
            - thumbnail-join
          always_run: true
          when: $thumbnail-join.output.artifacts.needsFix == true
          bash: node scripts/archon/rules-story.mjs thumbnail-fix-request "$INPUTS_PROJECT"
        - id: thumbnail-fix
          description: The one fix for blocked variants.
          depends_on:
            - thumbnail-fix-request
          context: fresh
          retry:
            max_attempts: 2
            on_error: transient
          when: $thumbnail-join.output.artifacts.needsFix == true
          command: thumbnail-fix
          skills:
            - thumbnails
            - typography
        - id: thumbnail-fixed
          description: "Record review/thumbnail-fix.json: the fix ran, so variants are not reviewed again."
          depends_on:
            - thumbnail-fix
          always_run: true
          when: $thumbnail-join.output.artifacts.needsFix == true
          bash: node scripts/archon/rules-story.mjs thumbnail-fixed "$INPUTS_PROJECT"
        - id: thumbnail-select
          description: "Choose the thumbnail: the passing one, or (after the fix) the best-ranked finished variant with the reason recorded. Says whether the operator can pick now."
          depends_on:
            - thumbnail-join
            - thumbnail-fixed
          always_run: true
          trigger_rule: none_failed_min_one_success
          bash: node scripts/archon/rules-story.mjs thumbnail-loop-result "$INPUTS_PROJECT"
        - id: thumbnail-gate
          description: Build the operator's options (passing variants, revise, stop) and hash them; is a choice required and missing?
          depends_on:
            - thumbnail-select
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            await emit("gate", {kind:"thumbnail"});
        - id: thumbnail-attention
          description: Ask the operator to pick a variant, ask for revisions, or stop.
          depends_on:
            - thumbnail-gate
          when: $thumbnail-select.output.artifacts.selectable == true && $thumbnail-gate.output.artifacts.needsAnswer == true
          wait:
            form: select
            attention: "Review $thumbnail-gate.output.artifacts.artifact for $INPUTS.project. Binding: $thumbnail-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback."
            options: $thumbnail-gate.output.artifacts.options
  - id: publishing-cycle
    description: Write copy → operator approval. Repeats while the operator asks for copy revisions.
    depends_on:
      - thumbnail-cycle
    loop_group:
      max_iterations: 4
      until_bash: node scripts/archon/rules-story.mjs publishing-loop-check "$INPUTS_PROJECT"
      nodes:
        - id: publishing-answer
          description: Record the operator's publishing decision from the previous pass (approve, revise, keep local, stop).
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            const answer = process.env.INPUTS_ANSWER;
            await emit("answer", {kind:"publishing", expected: process.env.INPUTS_BINDING, answer: answer ? JSON.parse(answer) : null});
          with:
            binding: $LOOP_PREV.publishing-gate.output.artifacts.binding
            answer: $LOOP_PREV.publishing-attention.output
        - id: publishing-stop
          description: "Operator chose Stop: end the run, keeping all artifacts."
          depends_on:
            - publishing-answer
          when: $publishing-answer.output.artifacts.rejected == true
          cancel: Operator stopped this production; retained artifacts remain available.
        - id: publishing-state
          description: Is publishing done (opted out, or current copy approved)?
          depends_on:
            - publishing-answer
            - publishing-stop
          trigger_rule: none_failed_min_one_success
          always_run: true
          bash: node scripts/archon/rules-story.mjs publishing-loop-result "$INPUTS_PROJECT"
        - id: publishing-copy
          description: Write or revise publishing.json.
          depends_on:
            - publishing-state
          context: fresh
          command: publishing-copy
          skills:
            - publishing
          when: $publishing-state.output.artifacts.done == false
          retry:
            max_attempts: 2
            on_error: transient
        - id: publishing-gate
          description: Validate publishing.json (invalid copy goes back to the author via archon/publishing-errors.json) and hash copy + video + thumbnail for approval.
          depends_on:
            - publishing-state
            - publishing-copy
          always_run: true
          runtime: bun
          script: |-
            const {emit} = await import(process.cwd() + "/scripts/archon/rules-story.mjs");
            await emit("gate", {kind:"publishing"});
          trigger_rule: none_failed_min_one_success
        - id: publishing-attention
          description: Ask the operator to approve the unlisted upload, revise the copy, keep it local or stop.
          depends_on:
            - publishing-gate
          when: $publishing-gate.output.artifacts.needsAnswer == true
          wait:
            form: select
            attention: "Review $publishing-gate.output.artifacts.artifact for $INPUTS.project. Binding: $publishing-gate.output.artifacts.binding. Reply with your decision and verbatim feedback. Approval needs no comment; revisions require your actual feedback."
            options:
              - id: approve
                label: Approve unlisted upload
              - id: revise
                label: Revise copy
              - id: opt-out
                label: Keep local only
              - id: reject
                label: Stop
  - id: publish
    description: Upload unlisted to abdupdates after re-checking every approval, qualified delivery and the chosen thumbnail; resumable and journaled. Writes archon/published.json. No-op when opted out.
    depends_on:
      - publishing-cycle
    always_run: true
    bash: node scripts/archon/rules-story.mjs publish "$INPUTS_PROJECT"
    retry:
      max_attempts: 1
      on_error: all
